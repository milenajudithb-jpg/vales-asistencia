/* ═══════════════════════ Controles de liquidación de una línea ═══════════════════════ */
function controlesLiq(l, opciones) {
  const estadoEl = h('div', { class: 'liq-pie' });
  const alCambiar = () => { ajustar(); opciones.alCambiar(); };
  const stDev = stepper({ valor: l.devuelto, etiqueta: 'Devolvió sin usar', alCambiar: v => {
    l.devuelto = v;
    if (!l.manual) { l.utilizado = redondea(Math.max(0, num(l.salio) - v)); stUti.poner(l.utilizado); }
    alCambiar();
  } });
  const stUti = stepper({ valor: l.utilizado, etiqueta: 'Utilizó o instaló', alCambiar: v => { l.utilizado = v; l.manual = true; alCambiar(); } });
  const stVie = stepper({ valor: l.viejaRec, etiqueta: 'Pieza vieja que trajo', alCambiar: v => { l.viejaRec = v; alCambiar(); } });
  const todas = h('button', { type: 'button', class: 'btn xs', onclick: () => { l.viejaRec = num(l.utilizado); stVie.poner(l.viejaRec); alCambiar(); } }, 'Trajo todas');
  const filaVieja = h('div', { class: 'liq-fila' },
    h('div', { class: 'et' }, h('b', null, 'Pieza vieja que trajo'), h('span', null, 'La que quitó de la unidad')),
    h('div', { class: 'der' }, stVie.el, todas));
  const consumible = opciones.conInterruptor
    ? interruptor('No regresa pieza vieja (consumible)', !l.requiereVieja, v => { l.requiereVieja = !v; alCambiar(); })
    : null;
  function ajustar() {
    const salio = num(l.salio);
    if (!l.manual) { l.utilizado = redondea(Math.max(0, salio - num(l.devuelto))); stUti.poner(l.utilizado); }
    stDev.limites(0, salio);
    stUti.limites(0, salio);
    if (num(l.viejaRec) > num(l.utilizado)) { l.viejaRec = num(l.utilizado); stVie.poner(l.viejaRec); }
    stVie.limites(0, num(l.utilizado));
    filaVieja.hidden = !l.requiereVieja;
    const c = calcLinea({ salio: salio, devuelto: l.devuelto, utilizado: l.utilizado, viejaRec: l.viejaRec, requiereVieja: l.requiereVieja }, true);
    const suma = redondea(num(l.devuelto) + num(l.utilizado));
    l.error = suma > salio ? 'Devolvió + utilizó (' + fmtN(suma) + ') pasa de lo que salió (' + fmtN(salio) + ').' : '';
    estadoEl.replaceChildren(
      l.error ? chip('st-bad', 'i-alert', l.error)
        : c.dif > 0 ? chip('st-bad', 'i-bad', fmtN(c.dif) + ' sin justificar: ni devuelto ni utilizado')
          : c.falta > 0 ? chip('st-bad', 'i-bad', c.falta === 1 ? 'Falta 1 pieza vieja' : 'Faltan ' + fmtN(c.falta) + ' piezas viejas')
            : chip('st-ok', 'i-ok', l.requiereVieja ? 'Completo' : 'Completo · no regresa pieza vieja'));
  }
  const el = h('div', { class: 'liq-cuerpo' },
    h('div', { class: 'liq-fila' }, h('div', { class: 'et' }, h('b', null, 'Devolvió sin usar'), h('span', null, 'Regresa a bodega')), h('div', { class: 'der' }, stDev.el)),
    h('div', { class: 'liq-fila' }, h('div', { class: 'et' }, h('b', null, 'Utilizó o instaló'), h('span', null, 'Se quedó en la unidad')), h('div', { class: 'der' }, stUti.el)),
    filaVieja,
    consumible ? h('div', { class: 'liq-fila' }, consumible) : null,
    estadoEl);
  ajustar();
  return { el: el, ajustar: ajustar };
}

function totalesModelo(lineas) {
  const t = { n: 0, salio: 0, dev: 0, uti: 0, req: 0, rec: 0, falta: 0, dif: 0, error: false };
  lineas.forEach(l => {
    const c = calcLinea({ salio: l.salio, devuelto: l.devuelto, utilizado: l.utilizado, viejaRec: l.viejaRec, requiereVieja: l.requiereVieja }, true);
    t.n += 1; t.salio += c.salio; t.dev += c.dev; t.uti += c.uti; t.req += c.req; t.rec += c.rec; t.falta += c.falta; t.dif += Math.abs(c.dif);
    if (l.error) t.error = true;
  });
  Object.keys(t).forEach(k => { if (typeof t[k] === 'number') t[k] = redondea(t[k]); });
  return t;
}

function resumenLiq(t) {
  const queda = t.error ? chip('st-bad', 'i-alert', 'Revisa las cantidades')
    : t.falta > 0 || t.dif > 0 ? chip('st-bad', 'i-bad', 'Quedará con faltantes') : chip('st-ok', 'i-ok', 'Quedará completo');
  return [h('div', null, 'Utilizó ', h('b', null, fmtN(t.uti)), ' · Devolvió ', h('b', null, fmtN(t.dev)), ' · Pieza vieja ', h('b', null, fmtN(t.rec) + ' de ' + fmtN(t.req))), queda];
}

/* Si no hay fotos de lo que regresó, se pide el motivo. */
async function motivoSinFoto(m, t) {
  if (m.fotos.length || (t.rec <= 0 && t.dev <= 0)) { m.sinFotoMotivo = ''; return true; }
  try {
    m.sinFotoMotivo = await pedirTexto('No agregaste fotos', 'Las fotos de las piezas viejas y de lo devuelto son el respaldo del vale. Si no se pudo tomar, escribe por qué.',
      { boton: 'Guardar sin foto', cancelar: 'Agregar foto', placeholder: 'Ej. teléfono sin batería' });
    return true;
  } catch (e) { return false; }
}

function errorAlGuardar(e) {
  if (e instanceof Cancelado) return;
  toast(e.message || 'No se pudo guardar.', true);
}

/* ═══════════════════════ Formulario: entregar / editar / registrar ═══════════════════════ */
function lineaNueva(liquidando) {
  return { lineaId: uuid(), codigo: '', descripcion: '', salio: 1, requiereVieja: true, devuelto: 0, utilizado: liquidando ? 1 : 0, manual: false, viejaRec: 0 };
}

function formSalida(cont, tipo, x) {
  const registrar = tipo === 'registrar';
  const editar = tipo === 'editar';
  if (editar && (!x || x.estado !== 'abierto')) { cont.append(noDisponible(x, 'editar')); return null; }
  const m = {
    tipo: tipo, valeId: x ? x.id : null, opId: uuid(), fotos: [], tipoFoto: null, sinFotoMotivo: '', sucio: false,
    vale: { numero: '', fecha: hoyISO(), hora: horaAhora(), unidad: '', mecanico: '', apoyo: '', obsSalida: '', entrego: '' },
    lineas: [lineaNueva(registrar)],
    liq: { fecha: hoyISO(), hora: horaAhora(), obs: '' },
  };
  if (editar) {
    const v = x.v;
    Object.assign(m.vale, { numero: v.numero, fecha: v.fecha, hora: v.hora, unidad: v.unidad, mecanico: v.mecanico, apoyo: v.apoyo, obsSalida: v.obsSalida });
    m.lineas = x.lineas.map(l => ({ lineaId: l.lineaId, codigo: l.codigo || '', descripcion: l.descripcion, salio: l.salio, requiereVieja: l.requiereVieja }));
  }
  leerBorrador(m);
  S.form = m;

  const reiniciar = () => { borrarBorrador(m); S.form = null; cont.replaceChildren(); formSalida(cont, tipo, x); };
  const titulo = editar ? 'Editar vale ' + x.id : registrar ? 'Registrar y liquidar' : 'Entregar repuestos';
  const sub = editar ? 'Corrige lo que salió de bodega. Queda en el historial.'
    : registrar ? 'Para un vale de papel que no se abrió aquí: lo que salió y cómo regresó.'
      : 'Abre el vale con lo que se lleva el mecánico.';

  const cambio = () => { guardarBorrador(m); pintarBarra(); };
  const entrada = (campoModelo, attrs) => {
    const el = h(attrs && attrs.tag === 'textarea' ? 'textarea' : 'input', Object.assign({ class: 'in', value: m.vale[campoModelo] || '' }, attrs || {}, { tag: null }));
    el.addEventListener('input', () => { m.vale[campoModelo] = el.value; cambio(); });
    return el;
  };
  const fNumero = campo('No. de vale físico', entrada('numero', { maxlength: '40', autocomplete: 'off' }), { opc: true, ayuda: 'El número impreso en el vale de papel, si hay.' });
  const fFecha = campo(registrar ? 'Fecha en que salió' : 'Fecha de salida', entrada('fecha', { type: 'date', max: hoyISO() }));
  const fHora = campo('Hora', entrada('hora', { type: 'time' }));
  const fUnidad = campo('Unidad', entrada('unidad', { list: 'dl-unidades', autocomplete: 'off', maxlength: '120', placeholder: 'Ej. Cabezal C-02' }), { req: true });
  const fMec = campo('Mecánico', entrada('mecanico', { list: 'dl-mecanicos', autocomplete: 'off', maxlength: '120', placeholder: 'Escribe para buscar' }), { req: true });
  const fApoyo = campo('Mecánico de apoyo', entrada('apoyo', { list: 'dl-mecanicos', autocomplete: 'off', maxlength: '120' }), { opc: true });
  fApoyo.hidden = !m.vale.apoyo;
  const btnApoyo = h('button', { type: 'button', class: 'btn sm ghost', hidden: !!m.vale.apoyo, onclick: () => { fApoyo.hidden = false; btnApoyo.hidden = true; $('input', fApoyo).focus(); } }, ic('i-plus'), 'Agregar mecánico de apoyo');

  let fEntrego = null;
  if (registrar) {
    const sel = h('select', { class: 'in', value: m.vale.entrego || '', onchange: () => { m.vale.entrego = sel.value; cambio(); } },
      h('option', { value: '' }, 'Yo mismo (quien firma)'),
      ((S.datos && S.datos.bodegueros) || []).map(b => h('option', { value: b }, nombre(b))));
    sel.value = m.vale.entrego || '';
    fEntrego = campo('¿Quién entregó los repuestos?', sel, { ayuda: 'Tú quedas como quien liquida el vale.' });
  }

  const listaLineas = h('div');
  const refs = [];
  function pintarLineas() {
    refs.length = 0;
    listaLineas.replaceChildren(...m.lineas.map((l, i) => {
      const r = tarjetaSalida(m, l, i, registrar, () => { m.lineas.splice(i, 1); cambio(); pintarLineas(); }, cambio);
      refs.push(r);
      return r.el;
    }));
  }
  pintarLineas();
  const agregarLinea = h('button', { type: 'button', class: 'btn block', onclick: () => {
    m.lineas.push(lineaNueva(registrar));
    cambio();
    pintarLineas();
    const ult = refs[refs.length - 1];
    if (ult) { ult.el.scrollIntoView({ block: 'center', behavior: 'smooth' }); $('input', ult.el).focus({ preventScroll: true }); }
  } }, ic('i-plus'), 'Agregar otro repuesto');

  const obs = registrar
    ? h('textarea', { class: 'in', maxlength: '500', value: m.liq.obs, oninput: e => { m.liq.obs = e.target.value; cambio(); } })
    : entrada('obsSalida', { tag: 'textarea', maxlength: '500' });

  const resumen = h('div', { class: 'resumen', 'aria-live': 'polite' });
  const btnGuardar = h('button', { type: 'button', class: 'btn pri', onclick: () => enviar() }, ic('i-check'), editar ? 'Guardar cambios' : registrar ? 'Liquidar vale' : 'Guardar vale');
  function pintarBarra() {
    if (registrar) { poner(resumen, resumenLiq(totalesModelo(m.lineas))); return; }
    const t = m.lineas.reduce((s, l) => s + num(l.salio), 0);
    resumen.replaceChildren(h('b', null, plural(m.lineas.length, 'repuesto', 'repuestos')), ' · ', plural(redondea(t), 'unidad', 'unidades'), ' en total');
  }

  meter(cont,
    cabeceraForm(titulo, sub, editar ? 'vale/' + x.id : 'bodega'),
    avisoBorrador(m, reiniciar),
    bloque('1', 'Datos del vale', null, h('div', { class: 'campos c3' }, fNumero, fFecha, fHora)),
    bloque('2', 'Unidad y mecánico', null, h('div', { class: 'campos c2' }, fUnidad, fMec), h('div', { class: 'campos', style: { marginTop: '10px' } }, fApoyo, btnApoyo), fEntrego ? h('div', { style: { marginTop: '12px' } }, fEntrego) : null),
    bloque('3', registrar ? 'Repuestos: lo que salió y cómo regresó' : 'Repuestos que salen',
      registrar ? 'Por cada repuesto: cuánto salió, cuánto devolvió sin usar, cuánto instaló y cuántas piezas viejas trajo.' : 'Apaga «Debe regresar la pieza vieja» para consumibles como aceite, grasa o tornillería.',
      listaLineas, agregarLinea),
    bloque('4', registrar ? 'Fotos de lo que regresó' : 'Fotos de lo que sale', registrar ? 'Piezas viejas, repuestos devueltos y el vale de papel.' : 'Opcional: los repuestos entregados o el vale firmado.',
      zonaFotos(m, registrar ? FOTOS_LIQ : FOTOS_ENTREGA, () => { m.sucio = true; })),
    registrar
      ? bloque('5', 'Liquidación', null, h('div', { class: 'campos c3' },
        campo('Observaciones', obs, { opc: true, cls: 'obs-c' }),
        campo('Fecha de liquidación', h('input', { class: 'in', type: 'date', max: hoyISO(), value: m.liq.fecha, oninput: e => { m.liq.fecha = e.target.value; cambio(); } })),
        campo('Hora', h('input', { class: 'in', type: 'time', value: m.liq.hora, oninput: e => { m.liq.hora = e.target.value; cambio(); } }))))
      : bloque('5', 'Observaciones', null, campo('Observaciones de la salida', obs, { opc: true })),
    h('div', { class: 'barra' }, h('div', { class: 'barra-in' }, resumen, btnGuardar)));
  pintarBarra();

  function validar() {
    let primero = null;
    const marca = (f, msg) => { f.error(msg); if (msg && !primero) primero = f; };
    marca(fUnidad, limpiar(m.vale.unidad) ? '' : 'Escribe la unidad.');
    marca(fMec, limpiar(m.vale.mecanico) ? '' : 'Escribe el mecánico.');
    marca(fFecha, /^\d{4}-\d{2}-\d{2}$/.test(m.vale.fecha) ? '' : 'Escribe la fecha.');
    if (!m.lineas.length) { toast('Agrega al menos un repuesto.', true); return false; }
    refs.forEach((r, i) => {
      const l = m.lineas[i];
      r.fCod.error(limpiar(l.codigo) ? '' : 'Escribe el código del repuesto.');
      if (!limpiar(l.codigo) && !primero) primero = r.fCod;
      r.errCant(num(l.salio) > 0 ? '' : 'La cantidad debe ser mayor que cero.');
      if (!(num(l.salio) > 0) && !primero) primero = r.el;
      if (registrar && l.error && !primero) primero = r.el;
    });
    if (primero) {
      primero.scrollIntoView({ block: 'center', behavior: 'smooth' });
      const inp = primero.querySelector && primero.querySelector('input,select,textarea');
      if (inp) inp.focus({ preventScroll: true });
      return false;
    }
    return true;
  }

  async function enviar() {
    if (!validar()) return;
    const vale = {
      numero: limpiar(m.vale.numero, 40), fecha: m.vale.fecha, hora: m.vale.hora, unidad: limpiar(m.vale.unidad, 120),
      mecanico: limpiar(m.vale.mecanico, 120), apoyo: limpiar(m.vale.apoyo, 120), obsSalida: limpiar(m.vale.obsSalida, 500),
      entrego: registrar ? m.vale.entrego : '',
    };
    const lineas = m.lineas.map(l => {
      const o = Object.assign({ lineaId: l.lineaId }, codigoYNombre(l), { salio: num(l.salio), requiereVieja: !!l.requiereVieja });
      if (registrar) Object.assign(o, { devuelto: num(l.devuelto), utilizado: num(l.utilizado), viejaRec: l.requiereVieja ? num(l.viejaRec) : 0 });
      return o;
    });
    if (registrar && !(await motivoSinFoto(m, totalesModelo(m.lineas)))) return;
    const op = {
      opId: m.opId,
      accion: editar ? 'editar' : 'abrir',
      momento: registrar ? 'Liquidación' : 'Entrega',
      etiqueta: (editar ? 'Cambios al vale ' + x.id : 'Vale ' + vale.unidad + ' · ' + nombre(vale.mecanico)) + ' (' + fechaCorta(vale.fecha) + ')',
      textoGuardando: editar ? 'Guardando cambios…' : 'Guardando vale…',
      payload: editar ? { id: x.id, vale: vale, lineas: lineas }
        : registrar ? { vale: vale, lineas: lineas, liquidacion: { fecha: m.liq.fecha, hora: m.liq.hora, obs: limpiar(m.liq.obs, 500), sinFotoMotivo: m.sinFotoMotivo } }
          : { vale: vale, lineas: lineas },
      fotos: m.fotos.map(f => ({ fotoId: f.fotoId, tipo: f.tipo, data: f.data })),
    };
    try {
      const r = await guardarConFirma(op, {
        titulo: 'Firma con tu PIN',
        texto: editar ? 'Quedará en el historial que tú hiciste el cambio.'
          : registrar ? 'Quedarás registrado como quien liquidó el vale.' : 'Quedarás registrado como quien entregó los repuestos.',
      });
      if (!r) return;
      borrarBorrador(m);
      S.form = null;
      mostrarExito({
        op: r.op, enCola: r.enCola,
        titulo: editar ? 'Cambios guardados' : registrar ? 'Vale registrado y liquidado' : 'Vale abierto',
        otra: editar ? null : registrar ? ['Registrar otro', 'registrar'] : ['Entregar otro', 'entregar'],
      });
    } catch (e) { errorAlGuardar(e); }
  }
  return m;
}

function tarjetaSalida(m, l, i, registrar, quitar, cambio) {
  // Solo se pide el código del repuesto; si está en el catálogo, su nombre aparece debajo.
  const cod = h('input', {
    class: 'in', list: 'dl-codigos', value: l.codigo, autocomplete: 'off', autocapitalize: 'characters',
    spellcheck: 'false', maxlength: '60', placeholder: 'Escribe el código',
  });
  const fCod = campo('Código del repuesto', cod, { req: true });
  const nom = h('div', { class: 'ayuda-c rep-nom', 'aria-live': 'polite' });
  fCod.insertBefore(nom, fCod.lastChild);
  const errCant = h('div', { class: 'err', role: 'alert' });
  let liq = null;
  const etiquetaCant = registrar ? 'Cantidad que salió' : 'Cantidad que sale';
  const cant = stepper({ valor: l.salio, etiqueta: etiquetaCant, alCambiar: v => { l.salio = v; if (liq) liq.ajustar(); cambio(); } });
  const swInp = h('input', { type: 'checkbox', onchange: () => { l.requiereVieja = swInp.checked; l.tocoSwitch = true; if (liq) liq.ajustar(); cambio(); } });
  swInp.checked = !!l.requiereVieja;
  const sw = h('label', { class: 'switch' }, swInp, h('span', { class: 'pista', 'aria-hidden': 'true' }), h('span', null, 'Debe regresar la pieza vieja'));
  const sugerir = () => {
    const r = infoCodigo(cod.value);
    nom.textContent = r && r.descripcion ? r.descripcion : '';
    const req = r ? r.requiereVieja : true;
    if (!l.tocoSwitch && l.requiereVieja !== req) { l.requiereVieja = req; swInp.checked = req; if (liq) liq.ajustar(); }
  };
  cod.addEventListener('input', () => { l.codigo = cod.value; sugerir(); cambio(); });
  if (registrar) liq = controlesLiq(l, { alCambiar: cambio });
  const r0 = infoCodigo(l.codigo);
  nom.textContent = r0 && r0.descripcion ? r0.descripcion
    : !limpiar(l.codigo) && limpiar(l.descripcion) ? 'Registrado antes como: ' + limpiar(l.descripcion, 150) : '';
  const el = h('div', { class: registrar ? 'liq nueva' : 'linea' },
    h('div', { class: registrar ? 'liq-cuerpo' : '' },
      h('div', { class: 'linea-top', style: registrar ? { marginTop: '10px' } : null },
        h('b', null, 'Repuesto ' + (i + 1)),
        m.lineas.length > 1 ? h('button', { type: 'button', class: 'btn xs ghost der', onclick: quitar, 'aria-label': 'Quitar repuesto ' + (i + 1) }, ic('i-close', 'sm'), 'Quitar') : null),
      fCod,
      h('div', { class: 'fila-cant' },
        h('div', { class: 'campo' }, h('span', { class: 'lbl', 'aria-hidden': 'true' }, etiquetaCant), cant.el, errCant),
        sw)),
    liq ? liq.el : null);
  return { el: el, fCod: fCod, errCant: msg => { errCant.textContent = msg || ''; } };
}

/* ═══════════════════════ Formulario: liquidar ═══════════════════════ */
function noDisponible(x, accion) {
  if (!x) return h('div', { class: 'card vacio' }, h('b', null, 'No encontré ese vale.'), 'Puede que todavía no se haya cargado o que el enlace esté mal.',
    h('div', { style: { marginTop: '12px' } }, h('button', { type: 'button', class: 'btn sm', onclick: () => ir('bodega') }, 'Ir a Bodega')));
  const msg = x.anulado ? 'Este vale está anulado.'
    : accion === 'recibir' ? 'Este vale no tiene piezas viejas pendientes.'
      : 'Este vale ya fue liquidado' + (x.v.liquido ? ' por ' + nombre(x.v.liquido) : '') + '.';
  return h('div', { class: 'card vacio' }, h('b', null, msg),
    h('div', { style: { marginTop: '12px', display: 'flex', gap: '8px', justifyContent: 'center', flexWrap: 'wrap' } },
      h('button', { type: 'button', class: 'btn sm', onclick: () => abrirDetalle(x.id) }, 'Ver el vale'),
      h('button', { type: 'button', class: 'btn sm', onclick: () => ir('bodega') }, 'Ir a Bodega')));
}

function resumenVale(x) {
  const v = x.v;
  return h('div', { class: 'resvale' },
    h('div', { class: 'l1' }, h('span', { class: 'mono' }, x.id), v.numero ? h('span', { class: 'muted' }, 'No. ' + v.numero) : null, chipEstado(x.estado)),
    h('div', { class: 'l2' }, v.unidad),
    h('div', { class: 'l3' }, [nombre(v.mecanico) + (v.apoyo ? ' (apoyo: ' + nombre(v.apoyo) + ')' : ''), 'Entregó ' + nombre(v.entrego), fechaMedia(v.fecha) + ' ' + (v.hora || '') + ' (' + hace(diasEntre(v.fecha, hoyISO())) + ')'].join(' · ')),
    v.obsSalida ? h('div', { class: 'l3' }, 'Nota de salida: ' + v.obsSalida) : null);
}

function formLiquidar(cont, x) {
  if (!x || x.estado !== 'abierto') { cont.append(noDisponible(x, 'liquidar')); return null; }
  const m = {
    tipo: 'liquidar', valeId: x.id, opId: uuid(), fotos: [], tipoFoto: null, sinFotoMotivo: '', sucio: false,
    liq: { fecha: hoyISO(), hora: horaAhora(), obs: '' },
    lineas: x.lineas.map(l => ({
      lineaId: l.lineaId, codigo: l.codigo || '', descripcion: l.descripcion, salio: l.salio, requiereVieja: l.requiereVieja,
      devuelto: num(l.devuelto), utilizado: l.utilizado == null ? redondea(l.salio - num(l.devuelto)) : num(l.utilizado),
      manual: l.utilizado != null, viejaRec: num(l.viejaRec),
    })),
    nuevas: [],
  };
  const original = m.lineas.map(l => l.lineaId).join(',');
  leerBorrador(m);
  if (m.lineas.map(l => l.lineaId).join(',') !== original) { borrarBorrador(m); m.restaurado = 0; m.lineas = x.lineas.map(l => ({ lineaId: l.lineaId, codigo: l.codigo || '', descripcion: l.descripcion, salio: l.salio, requiereVieja: l.requiereVieja, devuelto: 0, utilizado: l.salio, manual: false, viejaRec: 0 })); }
  S.form = m;
  const cambio = () => { guardarBorrador(m); pintarBarra(); };
  const reiniciar = () => { borrarBorrador(m); S.form = null; cont.replaceChildren(); formLiquidar(cont, x); };

  const lista = h('div', null, m.lineas.map(l => {
    const c = controlesLiq(l, { alCambiar: cambio, conInterruptor: true });
    return h('div', { class: 'liq' },
      h('div', { class: 'liq-cab' },
        h('div', { style: { minWidth: 0 } }, h('div', { class: 'nom mono-rep' }, etiquetaRep(l)), nombreRep(l) ? h('div', { class: 'rep-n' }, nombreRep(l)) : null),
        h('div', { class: 'salio' }, h('b', null, fmtN(l.salio)), h('span', null, 'salió'))),
      c.el);
  }));
  const listaNuevas = h('div');
  const refsNuevas = [];
  function pintarNuevas() {
    refsNuevas.length = 0;
    listaNuevas.replaceChildren(...m.nuevas.map((l, i) => {
      const r = tarjetaSalida({ lineas: [0, 0] }, l, i, true, () => { m.nuevas.splice(i, 1); cambio(); pintarNuevas(); }, cambio);
      $('.linea-top b', r.el).textContent = 'No estaba en el vale · ' + (i + 1);
      refsNuevas.push(r);
      return r.el;
    }));
  }
  pintarNuevas();
  const btnNueva = h('button', { type: 'button', class: 'btn block', onclick: () => {
    m.nuevas.push(lineaNueva(true));
    cambio();
    pintarNuevas();
    const r = refsNuevas[refsNuevas.length - 1];
    r.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    $('input', r.el).focus({ preventScroll: true });
  } }, ic('i-plus'), 'Agregar repuesto que salió y no estaba en el vale');

  const resumen = h('div', { class: 'resumen', 'aria-live': 'polite' });
  const btn = h('button', { type: 'button', class: 'btn pri', onclick: () => enviar() }, ic('i-check'), 'Liquidar vale');
  function pintarBarra() { poner(resumen, resumenLiq(totalesModelo(m.lineas.concat(m.nuevas)))); }

  meter(cont,
    cabeceraForm('Liquidar ' + x.id, 'El mecánico regresó: registra cómo vuelve cada repuesto.', 'liquidar'),
    avisoBorrador(m, reiniciar),
    resumenVale(x),
    bloque('1', 'Repuestos del vale', 'Lo que no se devolvió cuenta como utilizado. Por cada repuesto instalado debe regresar la pieza vieja, salvo consumibles.', lista, listaNuevas, btnNueva),
    bloque('2', 'Fotos', 'Toma foto de las piezas viejas y de lo que devolvió sin usar.', zonaFotos(m, FOTOS_LIQ, () => { m.sucio = true; })),
    bloque('3', 'Liquidación', null, h('div', { class: 'campos c3' },
      campo('Observaciones', h('textarea', { class: 'in', maxlength: '500', value: m.liq.obs, oninput: e => { m.liq.obs = e.target.value; cambio(); } }), { opc: true }),
      campo('Fecha de liquidación', h('input', { class: 'in', type: 'date', max: hoyISO(), value: m.liq.fecha, oninput: e => { m.liq.fecha = e.target.value; cambio(); } })),
      campo('Hora', h('input', { class: 'in', type: 'time', value: m.liq.hora, oninput: e => { m.liq.hora = e.target.value; cambio(); } })))),
    h('div', { class: 'barra' }, h('div', { class: 'barra-in' }, resumen, btn)));
  pintarBarra();

  async function enviar() {
    const t = totalesModelo(m.lineas.concat(m.nuevas));
    let malo = null;
    refsNuevas.forEach((r, i) => {
      const l = m.nuevas[i];
      r.fCod.error(limpiar(l.codigo) ? '' : 'Escribe el código del repuesto.');
      r.errCant(num(l.salio) > 0 ? '' : 'La cantidad debe ser mayor que cero.');
      if (!malo && (!limpiar(l.codigo) || !(num(l.salio) > 0))) malo = r.el;
    });
    if (!malo && t.error) malo = [...cont.querySelectorAll('.liq')].find(el => el.querySelector('.liq-pie .st-bad .ic use[href="#i-alert"]'));
    if (malo || t.error) {
      (malo || resumen).scrollIntoView({ block: 'center', behavior: 'smooth' });
      toast('Revisa las cantidades marcadas en rojo.', true);
      return;
    }
    if (!(await motivoSinFoto(m, t))) return;
    const op = {
      opId: m.opId, accion: 'liquidar', momento: 'Liquidación',
      etiqueta: 'Liquidación de ' + x.id + ' · ' + x.v.unidad,
      textoGuardando: 'Liquidando vale…',
      payload: {
        id: x.id, fecha: m.liq.fecha, hora: m.liq.hora, obs: limpiar(m.liq.obs, 500), sinFotoMotivo: m.sinFotoMotivo,
        lineas: m.lineas.map(l => ({ lineaId: l.lineaId, devuelto: num(l.devuelto), utilizado: num(l.utilizado), viejaRec: l.requiereVieja ? num(l.viejaRec) : 0, requiereVieja: !!l.requiereVieja })),
        nuevas: m.nuevas.map(l => Object.assign({ lineaId: l.lineaId }, codigoYNombre(l), { salio: num(l.salio), requiereVieja: !!l.requiereVieja, devuelto: num(l.devuelto), utilizado: num(l.utilizado), viejaRec: l.requiereVieja ? num(l.viejaRec) : 0 })),
      },
      fotos: m.fotos.map(f => ({ fotoId: f.fotoId, tipo: f.tipo, data: f.data })),
    };
    try {
      const r = await guardarConFirma(op, { titulo: 'Firma con tu PIN', texto: 'Quedarás registrado como quien liquidó el vale ' + x.id + '.', boton: 'Firmar y liquidar' });
      if (!r) return;
      borrarBorrador(m);
      S.form = null;
      mostrarExito({ op: r.op, enCola: r.enCola, titulo: 'Vale ' + x.id + ' liquidado', otra: ['Liquidar otro', 'liquidar'] });
    } catch (e) {
      if (e instanceof ApiError && e.codigo === 'ESTADO') { borrarBorrador(m); S.form = null; cargar(); }
      errorAlGuardar(e);
    }
  }
  return m;
}

/* ═══════════════════════ Formulario: recibir piezas viejas ═══════════════════════ */
function formRecibir(cont, x) {
  if (!x || x.estado !== 'faltante' || !(x.t.falta > 0)) { cont.append(noDisponible(x, 'recibir')); return null; }
  const pend = x.lineas.filter(l => l.falta > 0);
  const m = { tipo: 'recibir', valeId: x.id, opId: uuid(), fotos: [], tipoFoto: 'Piezas viejas', sucio: false, recibe: {}, liq: { obs: '' } };
  pend.forEach(l => { m.recibe[l.lineaId] = 0; });
  S.form = m;
  const resumen = h('div', { class: 'resumen', 'aria-live': 'polite' });
  const total = () => redondea(Object.keys(m.recibe).reduce((s, k) => s + num(m.recibe[k]), 0));
  const pintarBarra = () => {
    const n = total();
    const queda = redondea(x.t.falta - n);
    resumen.replaceChildren(h('div', null, 'Recibe ', h('b', null, fmtN(n)), ' de ', h('b', null, fmtN(x.t.falta)), ' pendientes'),
      queda > 0 ? chip('st-bad', 'i-bad', 'Seguirán faltando ' + fmtN(queda)) : x.t.dif > 0 ? chip('st-bad', 'i-bad', 'Quedan repuestos sin justificar') : chip('st-ok', 'i-ok', 'Quedará completo'));
  };
  const filas = pend.map(l => {
    const st = stepper({ valor: 0, max: l.falta, etiqueta: 'Recibe ahora: ' + etiquetaRep(l), alCambiar: v => { m.recibe[l.lineaId] = v; m.sucio = true; pintarBarra(); } });
    return h('div', { class: 'liq' },
      h('div', { class: 'liq-cab' },
        h('div', { style: { minWidth: 0 } }, h('div', { class: 'nom mono-rep' }, etiquetaRep(l)), nombreRep(l) ? h('div', { class: 'rep-n' }, nombreRep(l)) : null),
        h('div', { class: 'salio' }, h('b', null, fmtN(l.falta)), h('span', null, l.falta === 1 ? 'falta' : 'faltan'))),
      h('div', { class: 'liq-cuerpo' },
        h('div', { class: 'liq-fila' },
          h('div', { class: 'et' }, h('b', null, 'Recibe ahora'), h('span', null, 'Instaló ' + fmtN(l.uti) + ' · ya trajo ' + fmtN(l.rec))),
          h('div', { class: 'der' }, st.el, h('button', { type: 'button', class: 'btn xs', onclick: () => { st.poner(l.falta); m.recibe[l.lineaId] = l.falta; m.sucio = true; pintarBarra(); } }, 'Todas')))));
  });
  const btn = h('button', { type: 'button', class: 'btn pri', onclick: () => enviar() }, ic('i-check'), 'Guardar');
  meter(cont,
    cabeceraForm('Recibir pieza vieja', 'El mecánico trajo después la pieza que quitó de la unidad.', 'bodega'),
    resumenVale(x),
    bloque('1', 'Piezas viejas pendientes', null, filas),
    bloque('2', 'Fotos', 'Foto de las piezas viejas que entrega.', zonaFotos(m, ['Piezas viejas'], () => { m.sucio = true; })),
    bloque('3', 'Observaciones', null, campo('Observaciones', h('textarea', { class: 'in', maxlength: '300', oninput: e => { m.liq.obs = e.target.value; } }), { opc: true })),
    h('div', { class: 'barra' }, h('div', { class: 'barra-in' }, resumen, btn)));
  pintarBarra();
  async function enviar() {
    if (!(total() > 0)) { toast('Indica cuántas piezas viejas recibe.', true); return; }
    const op = {
      opId: m.opId, accion: 'piezasViejas', momento: 'Pieza vieja recibida después',
      etiqueta: 'Pieza vieja de ' + x.id + ' · ' + x.v.unidad, textoGuardando: 'Guardando…',
      payload: { id: x.id, obs: limpiar(m.liq.obs, 300), lineas: pend.filter(l => num(m.recibe[l.lineaId]) > 0).map(l => ({ lineaId: l.lineaId, antes: l.rec, viejaRec: redondea(l.rec + num(m.recibe[l.lineaId])) })) },
      fotos: m.fotos.map(f => ({ fotoId: f.fotoId, tipo: f.tipo, data: f.data })),
    };
    try {
      const r = await guardarConFirma(op, { titulo: 'Firma con tu PIN', texto: 'Quedará en el historial que tú recibiste la pieza vieja.' });
      if (!r) return;
      S.form = null;
      mostrarExito({ op: r.op, enCola: r.enCola, titulo: 'Pieza vieja registrada', otra: null });
    } catch (e) {
      if (e instanceof ApiError && e.codigo === 'CONFLICTO') { S.form = null; cargar(); }
      errorAlGuardar(e);
    }
  }
  return m;
}

/* ═══════════════════════ Pantalla de éxito ═══════════════════════ */
function mostrarExito(info) {
  S.exito = info;
  ir('listo', true);
}

function vistaListo(cont) {
  const info = S.exito;
  if (!info) { ir('bodega', true); return null; }

    cont.replaceChildren(h('div', { class: 'exito' },
      h('div', { class: 'ok' + (enCola || pendientesFotos || fallidas.length ? ' warn' : '') }, ic(enCola ? 'i-clock' : 'i-check', 'lg')),
      h('h2', null, enCola ? 'Guardado en este teléfono' : info.titulo),
      enCola ? h('p', null, 'No hubo conexión con la hoja. Se enviará solo cuando vuelva la señal; no borres los datos del navegador.') : null,
      y ? [
        h('p', null, h('span', { class: 'mono' }, y.id), ' · ', y.v.unidad, ' · ', nombre(y.v.mecanico)),
        h('p', null, y.liquidado ? 'Liquidó ' + nombre(y.v.liquido) : 'Entregó ' + nombre(y.v.entrego), ' · ', plural(y.lineas.length, 'repuesto', 'repuestos')),
        h('p', null, chipEstado(y.estado, ESTADOS[y.estado].largo)),
      ] : null,
      op.fotos && op.fotos.length && !enCola ? h('p', { class: 'muted' }, plural(op.fotos.filter(f => f.ok).length, 'foto guardada', 'fotos guardadas')) : null,
      pendientesFotos && !enCola ? h('p', null, chip('st-warn', 'i-clock', plural(pendientesFotos, 'foto pendiente', 'fotos pendientes') + ' de enviar; se suben solas')) : null,
      fallidas.length ? h('p', null, chip('st-bad', 'i-alert', plural(fallidas.length, 'foto no se pudo subir', 'fotos no se pudieron subir') + ': ' + fallidas[0].fallo)) : null,
      h('div', { class: 'acc' },
        info.otra ? h('button', { type: 'button', class: 'btn pri', onclick: () => ir(info.otra[1]) }, info.otra[0]) : null,
        y ? h('button', { type: 'button', class: 'btn', onclick: () => abrirDetalle(y.id) }, 'Ver el vale') : null,
        h('button', { type: 'button', class: 'btn', onclick: () => ir('bodega') }, 'Ir a Bodega'))));
  };
  pintar();
  return { actualizar: pintar };
}


/* ─── 05-tablero ─── */
/* ═══════════════════════ Filtros (Tablero y Vales) ═══════════════════════ */
function guardarFiltros() { sesion.set('filtros', S.filtros); }

function barraFiltros(alCambiar) {
  const f = S.filtros;
  const sel = (clave, etiqueta, opciones) => {
    const s = h('select', { class: 'in', 'aria-label': etiqueta, onchange: () => { f[clave] = s.value; cambio(); } });
    s.llenar = () => {
      const lista = opciones();
      s.replaceChildren(...lista.map(o => h('option', { value: o[0] }, o[1])));
      if (f[clave] && !lista.some(o => o[0] === f[clave])) s.append(h('option', { value: f[clave] }, nombre(f[clave])));
      s.value = f[clave] || '';
    };
    s.llenar();
    return s;
  };
  const valores = campo => {
    const m = new Map();
    (S.idx ? S.idx.vales : []).forEach(x => { [].concat(campo(x)).forEach(v => { if (v) m.set(v, (m.get(v) || 0) + 1); }); });
    return [...m.keys()].sort((a, b) => a.localeCompare(b, 'es'));
  };
  const periodos = () => {
    const meses = valores(x => String(x.v.fecha).slice(0, 7)).filter(m => /^\d{4}-\d{2}$/.test(m)).sort().reverse();
    return [['todo', 'Todo'], ['7d', 'Últimos 7 días'], ['30d', 'Últimos 30 días']]
      .concat(meses.map(m => ['mes:' + m, mesLargo(m)]))
      .concat([['rango', 'Entre fechas…']]);
  };
  const sPer = sel('periodo', 'Periodo', periodos);
  const sMec = sel('mecanico', 'Mecánico', () => [['', 'Todos']].concat(valores(x => [x.v.mecanico, x.v.apoyo]).map(v => [v, nombre(v)])));
  const sUni = sel('unidad', 'Unidad', () => [['', 'Todas']].concat(valores(x => x.v.unidad).map(v => [v, v])));
  const sBod = sel('bodeguero', 'Bodeguero', () => [['', 'Todos']].concat(valores(x => [x.v.entrego, x.v.liquido]).map(v => [v, nombre(v)])));
  const sEst = sel('estado', 'Estado', () => [['', 'Todos'], ['abierto', 'Por liquidar'], ['completo', 'Liquidado completo'], ['faltante', 'Liquidado con faltantes'], ['anulado', 'Anulados']]);
  const desde = h('input', { class: 'in', type: 'date', value: f.desde, 'aria-label': 'Desde', onchange: () => { f.desde = desde.value; cambio(); } });
  const hasta = h('input', { class: 'in', type: 'date', value: f.hasta, 'aria-label': 'Hasta', onchange: () => { f.hasta = hasta.value; cambio(); } });
  let qT = 0;
  const q = h('input', { class: 'in', type: 'search', value: f.q, placeholder: 'Vale, unidad, código…', 'aria-label': 'Buscar', oninput: () => { clearTimeout(qT); qT = setTimeout(() => { f.q = q.value; cambio(); }, 180); } });
  const cDesde = campo('Desde', desde);
  const cHasta = campo('Hasta', hasta);
  const activos = h('div', { class: 'activos' });
  const panel = h('div', { class: 'filtros-panel' });
  const btnMov = h('button', { type: 'button', class: 'btn sm', 'aria-expanded': 'false', onclick: () => {
    const abierto = btnMov.getAttribute('aria-expanded') === 'true';
    btnMov.setAttribute('aria-expanded', String(!abierto));
    panel.style.display = abierto ? 'none' : 'block';
  } }, ic('i-filter'), h('span'));
  panel.style.display = 'none';
  agregar(panel, [h('div', { class: 'filtros' },
    campo('Periodo', sPer), cDesde, cHasta, campo('Mecánico', sMec), campo('Unidad', sUni), campo('Bodeguero', sBod), campo('Estado', sEst), campo('Buscar', q, { cls: 'q' }))]);
  function etiquetaActivos() {
    const lista = [];
    if (f.periodo !== 'todo') lista.push(['periodo', f.periodo === 'rango' ? (f.desde ? fechaCorta(f.desde) : '…') + ' – ' + (f.hasta ? fechaCorta(f.hasta) : '…') : (periodos().find(p => p[0] === f.periodo) || [0, f.periodo])[1]]);
    if (f.mecanico) lista.push(['mecanico', nombre(f.mecanico)]);
    if (f.unidad) lista.push(['unidad', f.unidad]);
    if (f.bodeguero) lista.push(['bodeguero', nombre(f.bodeguero)]);
    if (f.estado) lista.push(['estado', ESTADOS[f.estado].corto]);
    if (f.q) lista.push(['q', '«' + f.q + '»']);
    return lista;
  }
  function pintarActivos() {
    const lista = etiquetaActivos();
    $('span', btnMov).textContent = lista.length ? 'Filtros (' + lista.length + ')' : 'Filtros';
    activos.replaceChildren(...lista.map(a => h('button', { type: 'button', 'aria-label': 'Quitar filtro ' + a[1], onclick: () => {
      if (a[0] === 'periodo') f.periodo = 'todo'; else f[a[0]] = '';
      if (a[0] === 'q') q.value = '';
      refrescar(); cambio();
    } }, a[1], ic('i-close', 'sm'))));
    if (lista.length > 1) activos.append(h('button', { type: 'button', onclick: () => {
      Object.assign(f, { periodo: 'todo', desde: '', hasta: '', mecanico: '', unidad: '', bodeguero: '', estado: '', q: '' });
      q.value = ''; refrescar(); cambio();
    } }, 'Quitar todos'));
    const rango = f.periodo === 'rango';
    cDesde.hidden = !rango;
    cHasta.hidden = !rango;
  }
  function cambio() { guardarFiltros(); S.limite = 40; pintarActivos(); alCambiar(); }
  function refrescar() { [sPer, sMec, sUni, sBod, sEst].forEach(s => s.llenar()); desde.value = f.desde; hasta.value = f.hasta; pintarActivos(); }
  pintarActivos();
  const el = h('div', { class: 'card card-pad' }, h('div', { class: 'filtros-mov' }, btnMov), panel, activos);
  el.refrescar = refrescar;
  return el;
}

/* ═══════════════════════ Tablero ═══════════════════════ */
function vistaTablero(cont) {
  const filtros = barraFiltros(() => pintar());
  const cuerpo = h('div');
  cont.append(filtros, cuerpo);
  function pintar() { poner(cuerpo, contenidoTablero()); }
  pintar();
  return { actualizar: () => { filtros.refrescar(); pintar(); } };
}

function kpi(etiqueta, valor, sub, extra) {
  return h('div', { class: 'kpi' + (extra && extra.ancho ? ' ancho' : '') },
    h('div', { class: 'k-lbl' }, etiqueta),
    h('div', { class: 'k-val' }, valor),
    sub ? h('div', { class: 'k-sub' }, sub) : null,
    extra && extra.meter ? extra.meter : null,
    extra && extra.link ? extra.link : null);
}

function medidor(a, b) {
  const p = b > 0 ? a / b : 0;
  const cls = b <= 0 ? '' : p >= 0.9 ? '' : p >= 0.7 ? ' warn' : ' bad';
  return h('div', { class: 'meter' + cls, role: 'img', 'aria-label': fmtN(a) + ' de ' + fmtN(b) }, h('i', { style: { width: Math.round(Math.min(1, p) * 100) + '%' } }));
}

function irConFiltro(cambios, vista) {
  Object.assign(S.filtros, cambios);
  guardarFiltros();
  S.limite = 40;
  if (S.ruta.vista === (vista || 'vales') && S.vistaActual) S.vistaActual.actualizar();
  else ir(vista || 'vales');
  window.scrollTo({ top: 0 });
}

function contenidoTablero() {
  if (!S.idx) return [estadoSinDatos()];
  const lista = filtrar(S.idx.vales);
  if (!S.idx.vales.length) {
    return [h('div', { class: 'card vacio', style: { marginTop: '16px' } }, h('b', null, 'Todavía no hay vales registrados.'),
      'Cuando los bodegueros entreguen y liquiden vales, aquí verás los indicadores.')];
  }
  const T = sumar(lista);
  const abiertos = lista.filter(x => x.estado === 'abierto').sort((a, b) => b.dias - a.dias);
  const atrasados = abiertos.filter(x => x.dias > diasAtraso());
  const falt = lista.filter(x => x.estado === 'faltante').sort((a, b) => b.t.falta - a.t.falta || b.diasFalta - a.diasFalta);
  const ret = pct(T.rec, T.req);
  const kpis = h('div', { class: 'kpis' },
    kpi('Vales', fmtN(lista.length), fmtN(T.liq) + ' liquidados · ' + fmtN(abiertos.length) + ' por liquidar'),
    kpi('Por liquidar', fmtN(abiertos.length),
      abiertos.length ? ['El más antiguo: ' + hace(abiertos[0].dias) + '. ', atrasados.length ? chip('st-bad', 'i-clock', plural(atrasados.length, 'atrasado', 'atrasados') + ' (+' + diasAtraso() + ' días)') : null] : 'Ninguno pendiente',
      abiertos.length ? { link: h('button', { type: 'button', class: 'k-link', onclick: () => irConFiltro({ estado: 'abierto' }) }, 'Ver vales abiertos') } : null),
    kpi('Retorno de pieza vieja', ret == null ? '—' : [fmtN(ret), h('small', null, '%')],
      T.req ? fmtN(T.rec) + ' de ' + fmtN(T.req) + ' piezas que debían regresar (vales liquidados)' : 'Aún no hay piezas que debían regresar',
      { meter: T.req ? medidor(T.rec, T.req) : null, ancho: true }),
    kpi('Piezas viejas faltantes', fmtN(T.falta),
      T.falta ? 'En ' + plural(falt.filter(x => x.t.falta > 0).length, 'vale liquidado', 'vales liquidados') : 'Todas las piezas viejas regresaron',
      T.falta ? { link: h('button', { type: 'button', class: 'k-link', onclick: () => irConFiltro({ estado: 'faltante' }) }, 'Ver vales con faltantes') } : null),
    kpi('Sin justificar', fmtN(T.dif), T.dif ? 'Repuestos que salieron y no se devolvieron ni se instalaron' : 'Todo lo que salió está devuelto o instalado'));

  // Resumen de repuestos (solo vales liquidados, para que las cifras cuadren)
  const liqs = lista.filter(x => x.liquidado && !x.anulado);
  const salioLiq = redondea(liqs.reduce((n, x) => n + x.t.salio, 0));
  const kpisRep = h('div', { class: 'kpis', style: { marginTop: '10px' } },
    kpi('Asistencias', fmtN(T.liq), 'Vales liquidados (' + fmtN(lista.length) + ' en total, ' + fmtN(abiertos.length) + ' abiertos)'),
    kpi('Repuestos que salieron', fmtN(salioLiq), 'Piezas entregadas por bodega en vales liquidados'),
    kpi('Devueltos sin usar', fmtN(T.dev), salioLiq ? fmtN(pct(T.dev, salioLiq)) + '% de lo que salió regresó a bodega' : ''),
    kpi('Instalados', fmtN(T.uti), salioLiq ? fmtN(pct(T.uti, salioLiq)) + '% de lo que salió se utilizó' : ''),
    kpi('Piezas viejas recibidas', fmtN(T.rec), T.req ? 'De ' + fmtN(T.req) + ' que debían regresar · faltan ' + fmtN(T.falta) : 'Aún no hay piezas que debían regresar'));

  // Por liquidar y faltantes
  const filaPend = x => h('tr', { class: 'clic', tabindex: '0', onclick: () => abrirDetalle(x.id), onkeydown: e => { if (e.key === 'Enter') abrirDetalle(x.id); } },
    h('td', null, h('span', { class: 'mono' }, x.id), h('div', { class: 'muted', style: { fontSize: '13px' } }, x.v.numero ? 'No. ' + x.v.numero : '')),
    h('td', null, h('div', { class: 'nom' }, x.v.unidad), h('div', { class: 'muted', style: { fontSize: '13px' } }, nombre(x.v.mecanico))),
    h('td', { class: 'n' }, chip(x.dias > diasAtraso() ? 'st-bad' : 'st-warn', 'i-clock', cap(hace(x.dias)))));
  const cPend = h('div', { class: 'card card-pad' },
    h('h3', null, 'Por liquidar'),
    h('p', { class: 'sub' }, 'Vales abiertos, del más antiguo al más reciente. En rojo, los que pasan de ' + diasAtraso() + ' días.'),
    abiertos.length ? h('div', { class: 'tabla-wrap' }, h('table', { class: 'tbl' }, h('tbody', null, abiertos.slice(0, 8).map(filaPend))))
      : h('div', { class: 'vacio' }, 'No hay vales abiertos en este filtro.'),
    abiertos.length > 8 ? h('button', { type: 'button', class: 'btn sm ver-tabla', onclick: () => irConFiltro({ estado: 'abierto' }) }, 'Ver los ' + abiertos.length) : null);
  const conFaltaPieza = falt.filter(x => x.t.falta > 0 || x.t.dif > 0);
  const cFalt = h('div', { class: 'card card-pad' },
    h('h3', null, 'Liquidados con faltantes'),
    h('p', { class: 'sub' }, 'Piezas viejas que no regresaron o repuestos sin justificar.'),

function agrupar(lista, clave) {
  const m = new Map();
  lista.forEach(x => {
    const k = clave(x);
    if (!k) return;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  });
  return m;
}

function tarjetaMecanicos(lista) {
  const filas = [...agrupar(lista, x => x.v.mecanico).entries()].map(([mec, xs]) => Object.assign({ mec: mec }, sumar(xs)))
    .sort((a, b) => b.falta - a.falta || b.dif - a.dif || b.vales - a.vales || a.mec.localeCompare(b.mec));
  return h('div', { class: 'card card-pad' },

/* Barras horizontales de una sola serie con su tabla equivalente. */
function graficoBarras(id, titulo, sub, filas, columnas) {

function tarjetaRepuestos(lista) {
  const m = new Map();
  lista.filter(x => x.liquidado).forEach(x => x.lineas.forEach(l => {
    const k = normal(etiquetaRep(l));
    if (!m.has(k)) m.set(k, { etiqueta: etiquetaRep(l) + (nombreRep(l) ? ' · ' + nombreRep(l) : ''), uti: 0, dev: 0, salio: 0, vales: new Set() });
    const r = m.get(k);
    r.uti += l.uti; r.dev += l.dev; r.salio += l.salio; r.vales.add(x.id);
  }));
  const filas = [...m.values()].map(r => ({
    etiqueta: r.etiqueta, valor: redondea(r.uti), textoValor: fmtN(redondea(r.uti)),
    detalle: 'Salió ' + fmtN(redondea(r.salio)) + ' · devolvió ' + fmtN(redondea(r.dev)) + ' · en ' + plural(r.vales.size, 'vale', 'vales'),
    salio: redondea(r.salio), dev: redondea(r.dev), nVales: r.vales.size,
  })).filter(f => f.valor > 0).sort((a, b) => b.valor - a.valor).slice(0, 10);
  return graficoBarras('rep', 'Repuestos más utilizados', 'Cantidad instalada en vales liquidados (los 10 primeros).', filas,
    [['Repuesto', f => f.etiqueta], ['Utilizó', f => fmtN(f.valor)], ['Salió', f => fmtN(f.salio)], ['Devolvió', f => fmtN(f.dev)], ['Vales', f => fmtN(f.nVales)]]);
}

function tarjetaUnidades(lista) {
  const filas = [...agrupar(lista, x => x.v.unidad).entries()].map(([u, xs]) => {
    const t = sumar(xs);
    return { etiqueta: u, valor: xs.length, textoValor: plural(xs.length, 'vale', 'vales'), detalle: 'Utilizó ' + fmtN(t.uti) + ' repuestos · ' + fmtN(t.liq) + ' liquidados', uti: t.uti, liq: t.liq };
  }).sort((a, b) => b.valor - a.valor || b.uti - a.uti).slice(0, 10);
  return graficoBarras('uni', 'Unidades con más vales', 'Número de vales de asistencia por unidad (las 10 primeras).', filas,
    [['Unidad', f => f.etiqueta], ['Vales', f => fmtN(f.valor)], ['Liquidados', f => fmtN(f.liq)], ['Utilizó', f => fmtN(f.uti)]]);
}

function tarjetaBodegueros(lista) {
  const m = new Map();
  const fila = n => { if (!m.has(n)) m.set(n, { n: n, entrego: 0, liquido: 0, ambos: 0 }); return m.get(n); };
  lista.forEach(x => {
    if (x.v.entrego) fila(x.v.entrego).entrego += 1;
    if (x.v.liquido) fila(x.v.liquido).liquido += 1;
    if (x.v.liquido && x.v.liquido === x.v.entrego) fila(x.v.liquido).ambos += 1;
  });
  const filas = [...m.values()].sort((a, b) => (b.entrego + b.liquido) - (a.entrego + a.liquido));
  return h('div', { class: 'card card-pad' },
    h('h3', null, 'Por bodeguero'),

function tarjetaMeses(lista) {

/* ═══════════════════════ Detalle del vale (cajón) ═══════════════════════ */

  S.entroDetalle = true;

function cerrarDetalle() {
  if (S.entroDetalle && history.length > 1) { S.entroDetalle = false; history.back(); }

}

function cerrarCajon() {
  if (!cajon) return;
  const c = cajon;
  cajon = null;

async function accionAdmin(x, accion) {
  const anular = accion === 'anular';
  const titulo = anular ? 'Anular ' + x.id : x.anulado ? 'Restaurar ' + x.id : 'Reabrir ' + x.id;
  const texto = anular ? 'El vale deja de contar en el tablero, pero queda en la hoja con el motivo.'
    : x.anulado ? 'El vale vuelve a contar con el estado que tenía.' : 'Se borra la liquidación para que un bodeguero la haga de nuevo. Las cantidades quedan como guía.';
  let motivo;
  try { motivo = await pedirTexto(titulo, texto, { boton: 'Continuar', placeholder: 'Motivo' }); } catch (e) { return; }
  try {
    await firmar({
      titulo: 'PIN de administrador', texto: 'Esta acción queda en el historial con tu nombre.', admin: true, boton: anular ? 'Anular vale' : 'Confirmar',
      accion: async pin => {
        progreso('Guardando…');
        try { aplicarPaquete(await api(accion, { pin: pin, id: x.id, motivo: motivo })); } finally { progreso(null); }
      },
    });
    toast(anular ? 'Vale anulado.' : x.anulado ? 'Vale restaurado.' : 'Vale reabierto.');
    refrescarVista();
    cargar();
  } catch (e) { errorAlGuardar(e); }
}

function agregarFotosVale(x) {

  const tipos = x.estado === 'abierto' ? FOTOS_ENTREGA.concat(['Otra']) : FOTOS_LIQ.concat(['Otra']);

    const op = { opId: uuid(), accion: 'fotos', valeId: x.id, momento: 'Adicional', etiqueta: plural(m.fotos.length, 'foto', 'fotos') + ' para ' + x.id, fotos: m.fotos.map(f => ({ fotoId: f.fotoId, tipo: f.tipo, data: f.data })) };

}

/* ═══════════════════════ Exportar a Excel ═══════════════════════ */
function cargarScript(src) {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar ' + src));
    document.head.append(s);
  });
}

function filasExport(lista) {
  const vales = lista.map(x => ({
    'ID vale': x.id, 'No. vale físico': x.v.numero || '', 'Estado': ESTADOS[x.estado].largo,
    'Fecha salida': x.v.fecha, 'Hora salida': x.v.hora || '', 'Unidad': x.v.unidad, 'Mecánico': x.v.mecanico, 'Mecánico de apoyo': x.v.apoyo || '',
    'Bodeguero que entregó': x.v.entrego, 'Fecha liquidación': x.v.fechaLiq || '', 'Bodeguero que liquidó': x.v.liquido || '',
    'Días abierto': x.dias, 'Salió': x.t.salio,
    'Devuelto sin usar': x.liquidado ? x.t.dev : '', 'Utilizado': x.liquidado ? x.t.uti : '',
    'Piezas viejas a regresar': x.liquidado ? x.t.req : '', 'Piezas viejas recibidas': x.liquidado ? x.t.rec : '',
    'Piezas viejas faltantes': x.liquidado ? x.t.falta : '', 'Sin justificar': x.liquidado ? x.t.dif : '',
    'Fotos': x.fotos.length, 'Observaciones salida': x.v.obsSalida || '', 'Observaciones liquidación': x.v.obsLiq || '',
    'Motivo sin foto': x.v.sinFotoMotivo || '', 'Motivo anulación': x.v.motivoAnulacion || '',
  }));
  const lineas = [];
  lista.forEach(x => x.lineas.forEach(l => lineas.push({
    'ID vale': x.id, 'No. vale físico': x.v.numero || '', 'Fecha salida': x.v.fecha, 'Unidad': x.v.unidad, 'Mecánico': x.v.mecanico,
    'Código': l.codigo || '', 'Repuesto': l.codigo ? nombreRep(l) : (l.descripcion || ''), 'Regresa pieza vieja': l.requiereVieja ? 'Sí' : 'No', 'Salió': l.salio,
    'Devuelto sin usar': x.liquidado ? l.dev : '', 'Utilizado': x.liquidado ? l.uti : '',
    'Pieza vieja a regresar': x.liquidado ? l.req : '', 'Pieza vieja recibida': x.liquidado ? l.rec : '',
    'Pieza vieja faltante': x.liquidado ? l.falta : '', 'Sin justificar': x.liquidado ? l.dif : '',
    'Estado': x.liquidado ? l.estadoL : 'Pendiente', 'Agregado al liquidar': l.agregada ? 'Sí' : '', 'Estado del vale': ESTADOS[x.estado].largo,
  })));
  return { vales: vales, lineas: lineas };
}

async function exportar(lista) {
  if (!lista.length) { toast('No hay vales para descargar con este filtro.', true); return; }
  const datos = filasExport(lista);
  const nombreArchivo = 'vales-asistencia-' + hoyISO();
  try {
    progreso('Preparando Excel…');
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const X = window.XLSX;
    const wb = X.utils.book_new();
    const hojaX = (filas, nombreHoja) => {
      const ws = X.utils.json_to_sheet(filas);
      const cols = Object.keys(filas[0] || {});
      ws['!cols'] = cols.map(c => ({ wch: Math.min(40, Math.max(c.length + 2, ...filas.slice(0, 200).map(f => String(f[c] == null ? '' : f[c]).length + 1))) }));
      if (filas.length) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: filas.length, c: cols.length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, nombreHoja);
    };
    hojaX(datos.vales, 'Vales');
    hojaX(datos.lineas, 'Repuestos');
    X.writeFile(wb, nombreArchivo + '.xlsx');
  } catch (e) {
    const csv = [Object.keys(datos.vales[0])].concat(datos.vales.map(f => Object.values(f)))
      .map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })), download: nombreArchivo + '.csv' });
    document.body.append(a); a.click(); a.remove();
    toast('Se descargó como CSV (no se pudo preparar el Excel).');
  } finally { progreso(null); }
}

function copiar(texto, ok) {
  const listo = () => toast(ok || 'Copiado.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(listo, () => prompt('Copia este enlace:', texto));
  } else prompt('Copia este enlace:', texto);
}


/* ─── 06-app ─── */
/* ═══════════════════════ Rutas ═══════════════════════ */
const VISTAS_BASE = ['bodega', 'tablero', 'vales'];
const FORMULARIOS = ['entregar', 'editar', 'liquidar', 'registrar', 'recibir'];
const RUTAS = VISTAS_BASE.concat(FORMULARIOS, ['vale', 'listo']);
let rutaForm = null;

function leerRuta() {
  let crudo = location.hash.replace(/^#\/?/, '');
  try { crudo = decodeURIComponent(crudo); } catch (e) { /* tal cual */ }
  const p = crudo.split('/');
  if (RUTAS.indexOf(p[0]) < 0) return { vista: store.get('vista', 'bodega'), id: null, hash: '', invalida: true };
  return { vista: p[0], id: p[1] || null, hash: crudo };
}

function ir(hash, reemplazar) {
  if (reemplazar) { history.replaceState(null, '', '#' + hash); onRuta(); return; }
  if (location.hash === '#' + hash) onRuta();
  else location.hash = hash;
}

function onRuta() {
  const r = leerRuta();
  if (r.invalida) { history.replaceState(null, '', '#' + r.vista); r.hash = r.vista; }
  if (S.form && rutaForm && r.hash !== rutaForm && S.form.fotos && S.form.fotos.length && r.vista !== 'listo') {
    if (!window.confirm('Tienes fotos sin guardar en este formulario. Si sales se pierden (lo escrito queda como borrador). ¿Salir?')) {
      history.pushState(null, '', '#' + rutaForm);
      return;
    }
  }
  S.ruta = r;
  if (r.vista === 'vale' && S.error !== 'pin') {
    if (!S.vistaActual || VISTAS_BASE.indexOf(String(S.montada).split('/')[0]) < 0) montar(S.base, null);
    marcarPestana('vale');
    pintarDetalle(r.id);
    return;
  }
  cerrarCajon();
  if (VISTAS_BASE.indexOf(r.vista) >= 0) { S.base = r.vista; store.set('vista', r.vista); }
  montar(r.vista, r.id);
}

function marcarPestana(vista) {
  const activa = VISTAS_BASE.indexOf(vista) >= 0 ? vista : vista === 'vale' ? S.base : 'bodega';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.vista === activa)));
}

function montar(vista, id) {
  // Si la hoja pide PIN y no hay uno válido, solo se muestra el candado.
  const bloqueado = S.error === 'pin';
  document.body.classList.toggle('bloqueado', bloqueado);
  if (bloqueado) {
    cerrarCajon();
    document.body.classList.remove('en-form');
    if (S.montada === 'candado') return;
    $('#main').replaceChildren(pantallaPinLectura());
    S.form = null;
    rutaForm = null;
    S.montada = 'candado';
    S.vistaActual = { candado: true };
    window.scrollTo(0, 0);
    return;
  }
  const clave = vista + '/' + (id || '');
  marcarPestana(vista);
  document.body.classList.toggle('en-form', FORMULARIOS.indexOf(vista) >= 0 || vista === 'listo');
  if (S.montada === clave && S.vistaActual && !S.vistaActual.esperando) {
    if (S.vistaActual.actualizar) S.vistaActual.actualizar();
    return;
  }
  const main = $('#main');
  main.replaceChildren();
  S.form = null;
  rutaForm = null;
  S.montada = clave;
  S.vistaActual = null;
  window.scrollTo(0, 0);
  if (id && FORMULARIOS.indexOf(vista) >= 0 && !S.idx) {
    main.append(estadoSinDatos());
    S.vistaActual = { esperando: true };
    return;
  }
  const x = id && S.idx ? S.idx.porId.get(id) : null;
  let v = null;
  switch (vista) {
    case 'tablero': v = vistaTablero(main); break;
    case 'vales': v = vistaVales(main); break;
    case 'entregar': formSalida(main, 'entregar'); break;
    case 'registrar': formSalida(main, 'registrar'); break;
    case 'editar': formSalida(main, 'editar', x); break;
    case 'liquidar': if (id) formLiquidar(main, x); else v = vistaElegir(main); break;
    case 'recibir': formRecibir(main, x); break;
    case 'listo': v = vistaListo(main); break;
    default: v = vistaBodega(main);
  }
  if (FORMULARIOS.indexOf(vista) >= 0 && S.form) rutaForm = S.ruta.hash || vista;
  S.vistaActual = v || { formulario: true };
  try { main.focus({ preventScroll: true }); } catch (e) { /* nada */ }
}

/* Vuelve a pintar la vista actual con datos nuevos (los formularios no se tocan). */
function refrescarVista(forzar) {
  pintarRed();
  const va = S.vistaActual;
  const enDetalle = S.ruta.vista === 'vale';
  // Al pasar de abierto a candado (o al revés) se vuelve a montar la vista, salvo con un formulario a medias.
  const cambioCandado = !S.form && (S.error === 'pin') !== (S.montada === 'candado');
  if (!va || va.esperando || forzar || cambioCandado) {
    S.montada = null;
    if (enDetalle) montar(S.base, null); else montar(S.ruta.vista, S.ruta.id);
  } else if (va.actualizar) {
    va.actualizar();
  }
  if (enDetalle && S.error !== 'pin') pintarDetalle(S.ruta.id);
}

/* ═══════════════════════ Encabezado ═══════════════════════ */
/* Cierra la sesión en este equipo: olvida el PIN y, si el tablero pide PIN, vuelve al candado. */
function salir() {
  sesion.del('lectura');
  store.del('lectura');
  store.del('firma');
  store.del('cache');
  S.datos = null;
  S.idx = null;
  if (store.get('pidePin', false)) { S.error = 'pin'; S.errorPin = ''; }
  refrescarVista(true);
  cargar();
}

function temaOscuro() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}

function pintarBotonTema() {
  const b = $('#btn-tema');
  const oscuro = temaOscuro();
  b.replaceChildren(ic(oscuro ? 'i-sun' : 'i-moon', 'sm'));
  b.setAttribute('aria-label', oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  b.title = b.getAttribute('aria-label');
}

function prepararEncabezado() {
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => ir(b.dataset.vista)));
  $('#btn-tema').addEventListener('click', () => {
    const nuevo = temaOscuro() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nuevo);
    store.set('tema', nuevo);
    pintarBotonTema();
  });
  pintarBotonTema();
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', pintarBotonTema);
  }
  const base = location.href.split('#')[0];
  conMenu($('#btn-datos'), cerrar => {
    const firma = store.get('firma', null);
    const lectura = sesion.get('lectura', '') || store.get('lectura', '');
    return [
      itemMenu('i-refresh', 'Actualizar ahora', () => { cargar(); procesarCola(); }, cerrar),
      itemMenu('i-download', 'Descargar Excel', () => exportar(filtrar(S.idx ? S.idx.vales : [])), cerrar, 'Vales y repuestos con los filtros actuales'),
      h('hr'),
      itemMenu('i-link', 'Copiar enlace para bodegueros', () => copiar(base + '#bodega', 'Enlace copiado. Compártelo con los bodegueros.'), cerrar),
      itemMenu('i-link', 'Copiar enlace del tablero', () => copiar(base + '#tablero', 'Enlace del tablero copiado.'), cerrar),
      S.datos && S.datos.hojaUrl
        ? h('a', { href: S.datos.hojaUrl, target: '_blank', rel: 'noopener', role: 'menuitem', onclick: () => cerrar() }, ic('i-sheet'),
          h('span', null, 'Abrir la hoja de Google', h('div', { class: 'muted' }, 'Solo si tienes acceso a la hoja')))
        : null,
      firma || lectura ? h('hr') : null,
      firma ? itemMenu('i-lock', 'Olvidar mi PIN en este teléfono', () => { store.del('firma'); toast('Este teléfono ya no recuerda tu PIN.'); }, cerrar, nombre(firma.nombre)) : null,
      firma || lectura ? itemMenu('i-lock', 'Salir del tablero', () => salir(), cerrar, store.get('pidePin', false) ? 'Para volver a entrar se pide el PIN' : null) : null,
    ];
  });
  $('#pie').textContent = 'Vales de asistencia · versión ' + VERSION + ' · Los datos se guardan en la hoja de Google de bodega y las fotos en Google Drive.';
}

/* ═══════════════════════ Inicio ═══════════════════════ */
async function iniciar() {
  prepararEncabezado();
  window.addEventListener('hashchange', onRuta);
  const c = store.get('cache', null);
  if (c && c.d && apiLista()) {
    try { aplicarDatos(c.d, true); S.ultimaCarga = c.t; } catch (e) { store.del('cache'); S.datos = null; S.idx = null; }
  }
  // Si el tablero pide PIN y este equipo no tiene uno guardado, se muestra el candado de una vez.
  if (!S.idx && apiLista() && !pinLectura() && store.get('pidePin', true)) S.error = 'pin';
  if (!location.hash) history.replaceState(null, '', '#' + store.get('vista', 'bodega'));
  onRuta();
  try { S.pendientes = await cola.todas(); } catch (e) { S.pendientes = []; }
  pintarAvisos();
  await cargar();
  procesarCola();
  window.addEventListener('online', () => { cargar(); procesarCola(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - S.ultimaCarga > 60000) { cargar(); procesarCola(); }
  });
  setInterval(() => { if (document.visibilityState === 'visible') { cargar(); procesarCola(); } }, 180000);
  window.addEventListener('beforeunload', e => {
    if (S.form && S.form.fotos && S.form.fotos.length) { e.preventDefault(); e.returnValue = ''; }
  });
}

iniciar();

})();
